# XcodeGen project definition — the source of truth for the Xcode project.
# Generate with: xcodegen generate   (never commit AniTV.xcodeproj)
name: AniTV

options:
  bundleIdPrefix: tv.anitv
  deploymentTarget:
    tvOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CLANG_ENABLE_MODULES: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    SWIFT_EMIT_LOC_STRINGS: YES

packages:
  AniLibertyKit:
    path: AniLibertyKit

targets:
  AniTV:
    type: application
    platform: tvOS
    sources:
      - path: App/Sources
      - path: App/Resources
        buildPhase: resources
    dependencies:
      - package: AniLibertyKit
        product: AniLibertyKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tv.anitv.client
        PRODUCT_NAME: AniTV
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
    # Generated by XcodeGen into App/Info.plist (kept outside App/Resources so the
    # resources build phase cannot copy it twice). Not meant to be committed.
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: AniTV
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UIUserInterfaceStyle: Automatic
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false

  AniTVUITests:
    type: bundle.ui-testing
    platform: tvOS
    sources:
      - path: App/UITests
    dependencies:
      - target: AniTV
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tv.anitv.client.uitests
        TEST_TARGET_NAME: AniTV
        GENERATE_INFOPLIST_FILE: YES

schemes:
  AniTV:
    build:
      targets:
        AniTV: all
    test:
      config: Debug
      targets:
        - AniTVUITests
    run:
      config: Debug
    archive:
      config: Release
