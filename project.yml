# XcodeGen project definition — the source of truth for the Xcode project.
# Generate with: xcodegen generate   (never commit AniTV.xcodeproj)
name: AniTV

options:
  bundleIdPrefix: tv.anitv
  deploymentTarget:
    # Raised from 26.0 on 2026-11-27 (ADR 0029): the sidebar header of ADR 0028 is tvOS 27.0-only.
    tvOS: "27.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CLANG_ENABLE_MODULES: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    SWIFT_EMIT_LOC_STRINGS: YES

packages:
  AniLibertyKit:
    path: AniLibertyKit

targets:
  AniTV:
    type: application
    platform: tvOS
    sources:
      - path: App/Sources
      - path: App/Resources
        buildPhase: resources
    dependencies:
      - package: AniLibertyKit
        product: AniLibertyKit
    # Optional local file that supplies DEVELOPMENT_TEAM for device builds. It is gitignored: a
    # developer ID is personal data, and CI signs nothing (CODE_SIGNING_ALLOWED=NO), so the public
    # spec stays free of it. See `Config/Base.xcconfig`.
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tv.anitv.client
        PRODUCT_NAME: AniTV
        # The session token lives in the Keychain; without an access group the simulator writes it to a
        # store that the next process cannot read, so the account vanished on every relaunch.
        CODE_SIGN_ENTITLEMENTS: App/AniTV.entitlements
        # Automatic signing is what a device needs. The team comes from Config/Local.xcconfig when it
        # exists, so simulator builds and CI (which passes CODE_SIGNING_ALLOWED=NO) work without it.
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
    # Generated by XcodeGen into App/Info.plist (kept outside App/Resources so the
    # resources build phase cannot copy it twice). Not meant to be committed.
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: AniTV
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UIUserInterfaceStyle: Automatic
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false

  AniTVUITests:
    type: bundle.ui-testing
    platform: tvOS
    sources:
      - path: App/UITests
    dependencies:
      - target: AniTV
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tv.anitv.client.uitests
        TEST_TARGET_NAME: AniTV
        GENERATE_INFOPLIST_FILE: YES

schemes:
  AniTV:
    build:
      targets:
        AniTV: all
    test:
      config: Debug
      targets:
        - AniTVUITests
    run:
      config: Debug
    archive:
      config: Release
